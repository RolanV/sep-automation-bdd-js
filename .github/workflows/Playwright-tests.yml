name: Static Validation

# Offline validation only.
#
# This workflow deliberately does NOT launch a browser, install Chromium, run
# Cucumber scenarios, or contact the application under test. The Gherkin
# scenarios in this repository drive a third-party training application that
# requires credentials, and one scenario submits a payment, so unattended
# browser execution is disabled until an authorized non-production target is
# confirmed. Only static checks that cannot reach the application run here.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # Manual runs are safe: this workflow performs static validation only.
  workflow_dispatch:

# No step writes to the repository, so read access is sufficient.
permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation (lockfile install + JS syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Defence in depth. No dependency in the current lockfile has an install
      # script that fetches browsers, but this guard keeps that true if the
      # dependency tree changes later.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Installs exactly the versions pinned in package-lock.json, which also
      # verifies that package.json and the lockfile remain consistent.
      - name: Install dependencies from lockfile
        run: npm ci

      # Parses every committed .js/.cjs file with Node's built-in syntax
      # checker. --check parses only: no module is imported or executed, so no
      # application code, fixture or step definition can run.
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          count=0
          failed=0

          # NUL-separated enumeration of tracked files, so paths containing
          # spaces or other unusual characters are handled correctly. The
          # pathspecs match nested directories as well as the repository root.
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if node --check -- "$file"; then
              echo "  ok      $file"
            else
              echo "::error file=$file::JavaScript syntax check failed"
              failed=$((failed + 1))
            fi
          done < <(git ls-files -z -- '*.js' '*.cjs')

          echo "---"
          echo "Checked $count file(s); $failed failure(s)."

          # A zero count means enumeration broke, not that the code is clean.
          if [ "$count" -eq 0 ]; then
            echo "::error::No tracked .js/.cjs files were found; file enumeration failed."
            exit 1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
